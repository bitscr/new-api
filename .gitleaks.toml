# Gitleaks 配置:提交/PR 安全门禁。
#
# 原则:
#   - 使用 Gitleaks 内置规则(github-token / [OI] / anthropic / aws / slack /
#     private-key / jwt 等),不另写宽泛正则以免噪声淹没真正的命中;
#   - 报告一律脱敏(--redact):只给规则、文件、提交与指纹,不给密钥原文;
#   - 例外按具体位置记录理由,绝不把真实密钥本体写进 allowlist;
#   - 扫描只做本地静态分析,不调用供应商验证凭据,也不上传源码到第三方服务。

title = "new-api secret scanning"

[extend]
useDefault = true

[allowlist]
# 两类例外都按"具体位置"记录,而不是忽略全部注释/文档/测试:
#   1) 部署示例与安装脚本里的固定数据库/Redis 示例密码——公开示例值,真实生产不复用;
#   2) common/str.go 脱敏函数示例注释里 key 形状的字面量——已确认为非运行配置。
#      这里只匹配该行的说明前缀,不写入任何密钥本体。
description = "documented example values and the masked-example comment line"
condition = "OR"
regexTarget = "line"
regexes = [
  '''Mask API keys \(e\.g\., "api_key:''',
]
paths = [
  '''docker-compose\.yml$''',
  '''\.env\.example$''',
  '''README\.md$''',
  '''install\.sh$''',
]
