name: secret-scan

# 安全门禁:只扫描本次提交/PR 引入的内容,不因历史里已确认的示例值而永久红灯。
# 历史清理(改写提交、强推)是单独授权的动作,不在这里自动执行。

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree (redacted)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan commits introduced by this change (redacted)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if [ -z "${range%%..*}" ] || [ "${range%%..*}" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          fi
          gitleaks detect --source . --log-opts="${range}" --config .gitleaks.toml --redact --verbose --exit-code 1
