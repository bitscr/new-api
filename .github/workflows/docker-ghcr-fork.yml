name: Publish Docker image to GHCR

# 只允许手动触发：Actions 页面「Run workflow」，或本机有凭据时 gh workflow run。
# 刻意不配置 push / schedule：推送和定时都不会自动构建或部署镜像。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag"
        required: false
        default: ""
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64,linux/arm64,linux/386,linux/arm/v7"

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
      matrix: ${{ steps.vars.outputs.matrix }}
      platforms: ${{ steps.vars.outputs.platforms }}
      slugs: ${{ steps.vars.outputs.slugs }}

    steps:
      - name: Prepare image metadata
        id: vars
        shell: bash
        env:
          REQUESTED_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          version="custom-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          requested_platforms="${REQUESTED_PLATFORMS:-linux/amd64,linux/arm64,linux/386,linux/arm/v7}"
          requested_platforms="${requested_platforms//[[:space:]]/}"

          # platform -> {"arch": buildx arch/variant, "slug": tag suffix, "platform": buildx platform}
          # 32-bit ARM stops at v7: the runtime base publishes arm/v5 and arm/v7 but no
          # arm/v6, so a v6 request would fail in the final stage.
          matrix_items=()
          seen=()
          platforms_out=()
          IFS=',' read -ra platforms <<< "$requested_platforms"
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64)
                entry='{"arch":"amd64","slug":"amd64","platform":"linux/amd64"}'
                ;;
              linux/arm64)
                entry='{"arch":"arm64","slug":"arm64","platform":"linux/arm64"}'
                ;;
              linux/386)
                entry='{"arch":"386","slug":"386","platform":"linux/386"}'
                ;;
              linux/arm/v7)
                entry='{"arch":"armv7","slug":"armv7","platform":"linux/arm/v7"}'
                ;;
              *)
                echo "::error::Unsupported platform '$platform'. Supported: linux/amd64, linux/arm64, linux/386, linux/arm/v7"
                exit 1
                ;;
            esac

            # De-duplicate so a repeated platform cannot publish the same tag twice.
            slug="$(echo "$entry" | sed -E 's/.*"slug":"([^"]+)".*/\1/')"
            if [[ " ${seen[*]-} " == *" $slug "* ]]; then
              continue
            fi
            seen+=("$slug")
            matrix_items+=("$entry")
            platforms_out+=("$platform")
          done

          if [ "${#matrix_items[@]}" -eq 0 ]; then
            echo "::error::At least one target platform is required"
            exit 1
          fi

          matrix="{\"include\":[$(IFS=,; echo "${matrix_items[*]}")]}"
          normalized_platforms="$(IFS=,; echo "${platforms_out[*]}")"
          slugs="$(printf '%s\n' "${seen[@]}" | paste -sd, -)"

          {
            echo "image=$image"
            echo "version=$version"
            echo "matrix=$matrix"
            echo "platforms=$normalized_platforms"
            echo "slugs=$slugs"
          } >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Prepare architecture tags
        id: tags
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          {
            echo "value<<EOF"
            echo "$IMAGE:latest-$SLUG"
            echo "$IMAGE:$VERSION-$SLUG"
            if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "latest" ]; then
              echo "$IMAGE:$REQUESTED_TAG-$SLUG"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The build stages cross-compile on the amd64 runner, but the final stage is the
      # target base image and runs apt-get there, so every non-amd64 target needs QEMU.
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=ghcr-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.slug }}
          provenance: false
          sbom: false

      - name: Output image tags
        env:
          TAGS: ${{ steps.tags.outputs.value }}
        run: |
          echo "### Published image (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create image manifests
    needs:
      - prepare
      - build_single_arch
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          SLUGS: ${{ needs.prepare.outputs.slugs }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          sources=()
          IFS=',' read -ra slugs <<< "$SLUGS"
          for slug in "${slugs[@]}"; do
            sources+=("$IMAGE:$VERSION-$slug")
          done

          publish_manifest() {
            local tag="$1"
            docker buildx imagetools create \
              -t "$IMAGE:$tag" \
              "${sources[@]}"
          }

          publish_manifest latest
          publish_manifest "$VERSION"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "latest" ]; then
            publish_manifest "$REQUESTED_TAG"
          fi

      - name: Output manifest details
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### Published image manifests" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
