name: Build release binaries

# 只允许手动触发：Actions 页面「Run workflow」，或本机有凭据时 gh workflow run。
# 刻意不配置 push / schedule：打 tag 或推送都不会自动构建 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Write version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "$VERSION" > VERSION

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$(cat ../VERSION)" bun run build

      - name: Build and package binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p release
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(cat VERSION)'" \
              -o "release/new-api-linux-$arch" .
            tar -C release -czf "release/new-api-linux-$arch.tar.gz" "new-api-linux-$arch"
            sha256sum "release/new-api-linux-$arch.tar.gz" > "release/new-api-linux-$arch.tar.gz.sha256"
          done
          ls -lh release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.sha256
          generate_release_notes: true
