name: Build release binaries

# 触发方式:推送 v* 标签自动构建并发布 Release;也可以在 Actions 页面手动
# Run workflow(可指定任意 tag)。Docker 镜像见 docker-ghcr-fork.yml(仅手动)。
on:
  # 推送 v* 标签时自动构建并发布 Release(二进制含 amd64/arm64/386/armv7)。
  # Docker 镜像工作流保持手动触发,不在这里联动。
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Write version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "$VERSION" > VERSION

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$(cat ../VERSION)" bun run build

      - name: Build and package binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p release
          # 四个目标:amd64 / arm64 / 386(32 位 x86) / armv7(GOARCH=arm + GOARM=7)。
          # sqlite 驱动是纯 Go(glebarez),CGO 关闭后交叉编译无额外依赖;
          # 32 位产物命名与 Docker 镜像的 slug 保持一致(armv7 而非 arm)。
          for spec in amd64 arm64 386 armv7; do
            case "$spec" in
              armv7) goarch=arm; goarm=7 ;;
              *)     goarch="$spec"; goarm="" ;;
            esac
            env GOOS=linux GOARCH="$goarch" ${goarm:+GOARM=$goarm} go build -trimpath \
              -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(cat VERSION)'" \
              -o "release/new-api-linux-$spec" .
            tar -C release -czf "release/new-api-linux-$spec.tar.gz" "new-api-linux-$spec"
            sha256sum "release/new-api-linux-$spec.tar.gz" > "release/new-api-linux-$spec.tar.gz.sha256"
          done
          ls -lh release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.sha256
          generate_release_notes: true
